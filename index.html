<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    
    <!-- ✅ SOLUCIÓN OWASP ZAP: Headers de Seguridad (Anti-Clickjacking y XSS) -->
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data: https:; connect-src 'self' https:;" />

    <!-- ✅ Mejor usar .ico o .svg para el favicon -->
    <link rel="icon" type="image/x-icon" href="/logo/logotextil.png" />
    <!-- ✅ Añadir favicon alternativo para navegadores modernos -->
    <link rel="icon" type="image/png" href="/logo/logotextil.png" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- ✅ Mejor título dinámico (se actualiza desde la API) -->
    <title>Carrera de Ingenieria Textil — UPEA</title>
    
  
    <!-- ✅ Meta tags para SEO y redes sociales -->
    <meta name="description" content="Carrera de Ingenieria Textil de la Universidad Pública de El Alto" />
    <meta name="keywords" content="ingenieria textil, UPEA, universidad, El Alto," />
    <meta name="author" content="Carrera de Ingenieria Textil - UPEA" />
    
    <!-- ✅ Open Graph (para compartir en redes sociales) -->
    <meta property="og:title" content="Carrera de Ingenieria Textil — UPEA" />
    <meta property="og:description" content="Formamos profesionales comprometidos con el bienestar humano y la salud mental" />
    <meta property="og:image" content="/logo/logotextil.png" />
    <meta property="og:type" content="website" />
    
    <!-- ✅ Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Carrera de Ingenieria Textil   — UPEA" />
    <meta name="twitter:description" content="Formamos profesionales comprometidos con el bienestar humano y la salud mental" />
    <meta name="twitter:image" content="/logo/logotextil.png" />
    
    <!-- ✅ Theme color para navegadores móviles -->
    <meta name="theme-color" content="#e68600" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
